{% extends 'base.html' %}

{% block content %}

<div class="news">
    <img src="{{news.image.url}}" alt="">
    <h2>{{news.title}}</h2>
    <p>{{news.body}}</p>
</div>
<style>
    .news {
        width: 100%;
        padding: 0 20%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin-top: 20px;
        gap: 20px;
    }
    .news > h2 {
        font-size: larger;
        text-align: center;
    }
</style>
{% endblock content %}
