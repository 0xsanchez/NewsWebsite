<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ new.title }}</title>
</head>
<body>
    <img src="{{ new.image.url }}" alt="">
    <h3>{{ new.title }}</h3>
    <p>{{ new.body }}</p>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: rgb(215, 180, 137);
            display: flex;
            flex-direction: column;
            padding: 20px 10%;
            align-items: center;
        }
        img {
            width: 70%;
        }
        p {
            width: 80%;
            font-size: larger;
        }
    </style>
</body>
</html>
