<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News List</title>
</head>
<body>
    {% for new in news %}

    <h3>{{ new.title }}</h3>
    {% endfor %}
</body>
</html>
