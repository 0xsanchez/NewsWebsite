{% extends 'base.html' %}
{% block content %}

<div class="main">
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="btns">
                <button type="submit">Submit</button>
            <a href="{% url 'home_page' %}">
                <button type="button">Cancel</button>
            </a>
        </div>
    </form>
</div>

<style>
    /* Контейнер формы */
.main {
    max-width: 600px;
    margin: 60px auto;
    padding: 30px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    font-family: 'Arial', sans-serif;
}

/* Поля формы */
.main form p {
    margin-bottom: 18px;
}

.main label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
    color: #333;
}

.main input[type="text"],
.main input[type="file"],
.main textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
    box-sizing: border-box;
    transition: 0.3s;
}

.main input[type="text"]:focus,
.main textarea:focus,
.main input[type="file"]:focus {
    border-color: #4a90e2;
    outline: none;
}

/* Блок кнопок */
.btns {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

/* Общие стили кнопок */
.btns button {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

/* Submit кнопка */
.btns button[type="submit"] {
    background-color: #4a90e2;
    color: white;
}

.btns button[type="submit"]:hover {
    background-color: #357ab8;
}

/* Cancel кнопка */
.btns a button {
    background-color: #e0e0e0;
    color: #333;
}

.btns a button:hover {
    background-color: #cfcfcf;
}

</style>

{% endblock content %}
