{% extends 'base.html' %}
{% block content %}

<div class="main">
    <div class="news">
        <img src="{{ news.image.url }}" alt="">
        <h4>{{ news.title }}</h4>
    </div>
    <div class="submit-con">
        <h2>Do you really want to delete thie news?</h2>
        <form action="" method="post">
            {% csrf_token %}
            <button type="submit">Yes</button>
            <a href="{% url 'home_page' %}">
                <button type="button">No</button>
            </a>
        </form>
    </div>
</div>

<style>
    .main {
    max-width: 700px;
    margin: 60px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    font-family: Arial, sans-serif;
}

.news {
    text-align: center;
    margin-bottom: 25px;
}

.news img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 15px;
}

.news h4 {
    font-size: 24px;
    color: #222;
    margin: 10px 0;
}

.submit-con {
    text-align: center;
}

.submit-con h2 {
    font-size: 22px;
    color: #444;
    margin-bottom: 25px;
}

.submit-con form {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.submit-con button {
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

/* YES button */
.submit-con button[type="submit"] {
    background-color: #e53935;
    color: white;
}

.submit-con button[type="submit"]:hover {
    background-color: #c62828;
}

/* NO button */
.submit-con a button {
    background-color: #e0e0e0;
    color: #333;
}

.submit-con a button:hover {
    background-color: #cfcfcf;
}

</style>
{% endblock content %}
